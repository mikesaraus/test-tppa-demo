<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TPPA POS web console: mock-up (not production)</title>
<!--
  INTERACTIVE MOCK-UP for the console setup screens. Throwaway: not part of the app.
  Update (2026-11-08): brought up to the console as built (Daily work, System, kiosks, sync).
  Update (2026-11-09, K8 mock-up): the Kiosks page (each kiosk now, Take out of service, the office
  count of a collected box), the kiosk exceptions and checks, kiosk notices by email.
  Update (2026-11-11): branch register and utility catalog, with focused record drawers and
  guided create dialogs.
  The app is the truth: where they differ, this file is out of date.
  Self-contained: no network, no fonts to download. Open by double-clicking.
  All names, numbers and codes are synthetic. Nothing is saved; reload resets everything.
-->
<style>
:root {
  /* Paper and ink: the console is a ledger, not a dashboard. */
  --paper: #f6f4ef;          /* canvas: warm form paper */
  --sheet: #fffefb;          /* raised surfaces */
  --sheet-2: #fbfaf6;        /* inset: inputs, table heads */
  --ink: #1c2530;            /* primary text: ribbon ink */
  --ink-2: #47515d;          /* secondary */
  --ink-3: #68707c;          /* labels, metadata, placeholders (4.5:1, WCAG AA) */
  --ink-4: #888e96;          /* icons and other non-text marks only (3:1) */
  --rule: rgba(28, 37, 48, 0.09);
  --rule-2: rgba(28, 37, 48, 0.16);
  --meter: #1f5ea8;          /* the one accent: utility meter blue */
  --meter-soft: #e8eff8;
  --in-force: #2d7550;  --in-force-soft: #e5f1ea;
  --scheduled: #98620c; --scheduled-soft: #faf0dc;
  --stamp: #b0322a;     --stamp-soft: #f7e5e2;   /* destructive, like a BIR stamp */
  --form: #fffdf4;           /* receipt stock */
  --on-accent: #ffffff;      /* text on the accent */
  --raised: #ffffff;         /* a button under the pointer */
  --meter-dark: #1a5194;
  --hover: rgba(28, 37, 48, 0.045);
  --tint: rgba(28, 37, 48, 0.06);
  --scrim: rgba(28, 37, 48, 0.32);
  --meter-ink: #18406f; --in-force-ink: #1e5338; --scheduled-ink: #6d4708; --stamp-ink: #7d221c;
  --shadow-modal: 0 10px 40px rgba(28, 37, 48, 0.25);
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  --r-sm: 5px; --r-md: 8px; --r-lg: 12px;
  --lift: 0 0 0 1px rgba(28,37,48,.07), 0 1px 2px -1px rgba(28,37,48,.08), 0 3px 8px rgba(28,37,48,.05);
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
}
/* Dark, as the console (apps/web globals.css): the same hierarchy, lighter and calmer colours. */
:root[data-theme='dark'] {
  color-scheme: dark;
  --paper: #13171c; --sheet: #1b2027; --sheet-2: #20262e;
  --ink: #e6e9ed; --ink-2: #c2c8d0; --ink-3: #9aa3ae; --ink-4: #737c87;
  --rule: rgba(255, 255, 255, 0.08); --rule-2: rgba(255, 255, 255, 0.15);
  --meter: #6ea8ea; --meter-soft: #1b2b40; --meter-dark: #8bbaf0;
  --in-force: #6fcf97; --in-force-soft: #16301f;
  --scheduled: #e3b25f; --scheduled-soft: #35290f;
  --stamp: #f08a80; --stamp-soft: #3a1d1a;
  --on-accent: #0b1420; --raised: #262d36;
  --hover: rgba(255, 255, 255, 0.05); --tint: rgba(255, 255, 255, 0.07);
  --scrim: rgba(0, 0, 0, 0.55);
  --meter-ink: #b9d4f5; --in-force-ink: #b5e8c9; --scheduled-ink: #f1d6a3; --stamp-ink: #f8c4be;
  --lift: 0 0 0 1px rgba(255, 255, 255, 0.07), 0 4px 14px rgba(0, 0, 0, 0.35);
  --shadow-modal: 0 10px 40px rgba(0, 0, 0, 0.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 14px/1.5 var(--sans); color: var(--ink); background: var(--paper);
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-size: 13px; letter-spacing: -0.01em; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }
h1 { font-size: 22px; line-height: 1.25; font-weight: 600; letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
h2 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -0.005em; }
h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); margin: 0 0 8px; }
p { margin: 0; text-wrap: pretty; }

/* Banner marking this as a mock-up */
.proto { position: fixed; z-index: 50; bottom: 12px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--paper); font-size: 12px; padding: 6px 12px; border-radius: 999px; box-shadow: var(--lift); }
.proto a { color: var(--paper); text-decoration: underline; }

/* Shell: sidebar sits on the same paper as the page */
.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100%; }
.side { padding: 20px 12px; border-right: 1px solid var(--rule); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.topbar { display: none; }
.side-scrim { display: none; }
/* Below 1024 px, as the console: a top bar with the menu button; the menu is a drawer. */
@media (max-width: 1023px) {
  .shell { display: block; }
  .topbar { display: flex; position: sticky; top: 0; z-index: 10; height: 56px; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--rule); background: color-mix(in srgb, var(--paper) 95%, transparent); }
  .topbar .brand { padding: 0; }
  .side { display: none; }
  .shell.menu-open .side { display: flex; position: fixed; top: 0; left: 0; z-index: 30; width: min(290px, 86vw); height: 100%; background: var(--paper); border-right: 0; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .shell.menu-open .side-scrim { display: block; position: fixed; inset: 0; z-index: 20; background: var(--scrim); }
  main { padding: 20px 16px 80px; }
}
.brand { padding: 0 10px; }
.brand b { display: block; font-size: 15px; letter-spacing: -0.01em; }
.brand span { font-size: 12px; color: var(--ink-3); }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav .group { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-4); padding: 14px 10px 6px; }
.nav a { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: var(--r-sm);
  color: var(--ink-2); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--hover); color: var(--ink); }
.nav a.on { background: var(--sheet); color: var(--ink); box-shadow: var(--lift); }
.me { margin-top: auto; padding: 10px; border-top: 1px solid var(--rule); font-size: 13px; }
.me b { display: block; font-weight: 600; }
.me button { margin-top: 6px; }
main { padding: 28px 36px 80px; max-width: 1180px; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 20px; }
.head p { color: var(--ink-3); margin-top: 4px; }

/* Controls */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: var(--r-sm);
  border: 1px solid var(--rule-2); background: var(--sheet); font-weight: 500; cursor: pointer;
  transition: transform 120ms var(--ease), background-color 120ms; }
.btn:hover { background: var(--raised); border-color: var(--rule-2); }
.btn:active { transform: scale(0.97); }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--meter); outline-offset: 2px; }
.btn.primary { background: var(--meter); border-color: var(--meter); color: var(--on-accent); }
.btn.primary:hover { background: var(--meter-dark); border-color: var(--meter-dark); }
.btn.danger { color: var(--stamp); }
.btn.danger.solid { background: var(--stamp); border-color: var(--stamp); color: var(--on-accent); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 500; color: var(--ink-2); }
.field .hint { font-size: 12px; color: var(--ink-3); }
.field .err { font-size: 12px; color: var(--stamp); }
input, select, textarea { height: 36px; padding: 0 10px; border-radius: var(--r-sm); border: 1px solid var(--rule-2); background: var(--sheet-2); }
textarea { height: auto; padding: 8px 10px; }
/* A field's control fills its column, so side-by-side fields line up (and never stick out). */
.field > input, .field > select, .field > textarea { width: 100%; min-width: 0; }
.grid2 > *, .grid3 > * { min-width: 0; }
input.code { font-family: var(--mono); letter-spacing: 0.08em; }
.row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }

/* Surfaces */
.sheet { background: var(--sheet); border-radius: var(--r-md); box-shadow: var(--lift); }
.pad { padding: 18px 20px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3);
  padding: 10px 14px; background: var(--sheet-2); border-bottom: 1px solid var(--rule); }
td { padding: 10px 14px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: rgba(31,94,168,.035); }
td.num { text-align: right; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { color: var(--in-force); background: var(--in-force-soft); }
.chip.wait { color: var(--scheduled); background: var(--scheduled-soft); }
.chip.off { color: var(--ink-3); background: var(--tint); }
.chip.bad { color: var(--stamp); background: var(--stamp-soft); }
.chip.blue { color: var(--meter); background: var(--meter-soft); }
.lock { font-size: 11px; color: var(--ink-3); border: 1px solid var(--rule-2); border-radius: 4px; padding: 0 5px; margin-left: 6px; }
.toolbar { display: flex; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--rule); }
.toolbar input, .toolbar select { height: 32px; }

/* Attention list (overview) */
.attention { display: flex; flex-direction: column; }
.attention a { display: grid; grid-template-columns: 110px 1fr auto; gap: 16px; align-items: center; padding: 14px 20px;
  border-bottom: 1px solid var(--rule); color: inherit; text-decoration: none; }
.attention a:last-child { border-bottom: 0; }
.attention a:hover { background: rgba(31,94,168,.035); }
.attention .go { color: var(--meter); font-weight: 500; font-size: 13px; }
.today { display: flex; gap: 36px; padding: 18px 20px; }
.today .v { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.today .l { font-size: 12px; color: var(--ink-3); }

/* Version timeline (signature 1) */
.timeline { position: relative; padding: 6px 0 6px 26px; }
.timeline::before { content: ""; position: absolute; left: 9px; top: 14px; bottom: 14px; width: 2px; background: var(--rule-2); }
.tl { position: relative; padding: 12px 16px; margin-bottom: 10px; border-radius: var(--r-md); background: var(--sheet); box-shadow: var(--lift); cursor: pointer; }
.tl::before { content: ""; position: absolute; left: -22px; top: 18px; width: 12px; height: 12px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink-4); }
.tl.inforce::before { background: var(--in-force); border-color: var(--in-force); box-shadow: 0 0 0 4px var(--in-force-soft); }
.tl.next::before { border-color: var(--scheduled); background: var(--scheduled-soft); }
.tl.draft { background: transparent; box-shadow: none; border: 1px dashed var(--rule-2); }
.tl.retired { opacity: .6; }
.tl .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.tl .ver { font-family: var(--mono); font-weight: 600; }
.tl .sum { margin-top: 4px; color: var(--ink-2); }
.tl .meta { margin-top: 6px; font-size: 12px; color: var(--ink-3); }
.now-marker { font-size: 11px; font-weight: 600; letter-spacing: .07em; color: var(--in-force); text-transform: uppercase; margin: 2px 0 10px -26px; display: flex; align-items: center; gap: 8px; }
.now-marker::after { content: ""; flex: 1; height: 1px; background: var(--in-force); opacity: .4; }

/* Charges preview */
.charges { font-family: var(--mono); font-size: 13px; }
.charges div { display: flex; justify-content: space-between; padding: 3px 0; }
.charges .t { border-top: 1px solid var(--rule-2); margin-top: 6px; padding-top: 8px; font-weight: 700; }
.charges .sub { color: var(--ink-3); padding-left: 14px; }

/* Perforated form preview (signature 2) */
.form-wrap { overflow-x: auto; padding: 4px; }
.form { position: relative; display: inline-block; background: var(--form); padding: 14px 34px; box-shadow: var(--lift);
  border-top: 1px dashed rgba(28,37,48,.25); border-bottom: 1px dashed rgba(28,37,48,.25); }
.form::before, .form::after { content: ""; position: absolute; top: 0; bottom: 0; width: 14px;
  background-image: radial-gradient(circle at 7px 9px, var(--paper) 3.5px, transparent 4px); background-size: 14px 18px; }
.form::before { left: 8px; } .form::after { right: 8px; }
.form pre { position: relative; margin: 0; overflow: hidden; box-sizing: content-box; font: 11px/1 var(--mono); line-height: var(--row, 1.38); color: #2b2d55; letter-spacing: 0; }
.form .preprinted { color: #68707c; }
.form .band { position: absolute; left: 0; right: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; color: #5f6773; text-align: center; white-space: normal; overflow: hidden; background: repeating-linear-gradient(135deg, rgba(104,112,124,.10) 0 5px, transparent 5px 10px); }
.form .band > span { font: 11px/1.2 var(--sans); padding: 0 40px; }
.form .band.top { border-bottom: 1px dashed rgba(104,112,124,.55); } .form .band.bottom { border-top: 1px dashed rgba(104,112,124,.55); }
.form mark { background: rgba(31,94,168,.10); color: inherit; border-radius: 2px; }

/* Overlays */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-start; justify-content: center;
  padding-top: 10vh; z-index: 20; animation: fade 160ms var(--ease); }
.modal { width: min(460px, 92vw); background: var(--sheet); border-radius: var(--r-lg); box-shadow: var(--shadow-modal);
  padding: 22px 24px; animation: pop 200ms var(--ease); }
.modal h2 { margin-bottom: 6px; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.drawer-scrim { align-items: stretch; justify-content: flex-end; padding: 0; }
.drawer { width: min(520px, 96vw); background: var(--sheet); height: 100%; padding: 24px; overflow-y: auto; box-shadow: var(--shadow-modal); animation: slide 220ms var(--ease); }
.drawer .actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
@keyframes fade { from { opacity: 0 } }
@keyframes pop { from { opacity: 0; transform: scale(.97) } }
@keyframes slide { from { transform: translateX(24px); opacity: 0 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.regcode { font: 600 26px/1 var(--mono); letter-spacing: .12em; text-align: center; padding: 18px; background: var(--sheet-2); border-radius: var(--r-md); margin: 14px 0 10px; }
.callout { padding: 10px 12px; border-radius: var(--r-sm); font-size: 13px; }
.callout.warn { background: var(--scheduled-soft); color: var(--scheduled-ink); }
.callout.info { background: var(--meter-soft); color: var(--meter-ink); }
.callout.bad { background: var(--stamp-soft); color: var(--stamp-ink); }
.toast { position: fixed; right: 20px; bottom: 56px; background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: var(--r-md); z-index: 30; animation: pop 180ms var(--ease); max-width: 380px; }
.bar { height: 6px; background: var(--tint); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--in-force); }
.bar.low i { background: var(--scheduled); }
dl { display: grid; grid-template-columns: 140px 1fr; gap: 8px 12px; margin: 14px 0 0; }
dt { color: var(--ink-3); font-size: 13px; } dd { margin: 0; }

/* Sign-in */
.auth { min-height: 100%; display: grid; place-items: center; }
.auth .card { width: min(380px, 92vw); padding: 28px; }
.auth .card h1 { margin-bottom: 4px; }
.otp { display: flex; gap: 8px; justify-content: center; margin: 18px 0; }
.otp input { width: 44px; height: 52px; text-align: center; font: 600 22px var(--mono); }
.qr { width: 148px; height: 148px; margin: 12px auto; background:
  repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 12px),
  repeating-linear-gradient(0deg, var(--ink) 0 6px, transparent 6px 14px); opacity: .85; border: 10px solid #fff; outline: 1px solid var(--rule-2); }
.codes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; padding: 12px; background: var(--sheet-2); border-radius: var(--r-sm); }
.me-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
.me .me-row button { margin-top: 0; }
/* Theme switch (theme-switch.tsx): three icon buttons as a radio group */
.theme { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; }
.me .theme button { margin: 0; width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 999px; background: transparent; color: var(--ink-3); cursor: pointer; }
.theme button:hover { color: var(--ink); }
.theme button.on { background: var(--sheet); color: var(--ink); box-shadow: var(--lift); }
.theme svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
/* Users: role chips with counts, person cell */
.roles { display: flex; gap: 4px; margin-bottom: 12px; overflow-x: auto; font-size: 13px; }
.roles button { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); font-weight: 500; cursor: pointer; white-space: nowrap; }
.roles button:hover { background: var(--tint); color: var(--ink); }
.roles button.on { background: var(--ink); color: var(--sheet); }
.roles button span { min-width: 20px; padding: 0 6px; border-radius: 999px; font-size: 11px; background: var(--tint); color: var(--ink-3); }
.roles button.on span { background: rgba(255,255,255,.2); color: inherit; }
.person { display: flex; align-items: center; gap: 12px; }
.avatar { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 50%; font-size: 12px; font-weight: 600; background: var(--tint); color: var(--ink-2); }
.avatar.admin { background: var(--meter-soft); color: var(--meter); }
.avatar.dim { opacity: .5; }
.you { margin-left: 6px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 500; background: var(--meter-soft); color: var(--meter); }
.foot { padding: 10px 14px; border-top: 1px solid var(--rule); }
/* Small pieces */
.tag { margin-left: 8px; padding: 1px 6px; border: 1px solid var(--rule-2); border-radius: 4px; font-size: 12px; font-weight: 500; color: var(--ink-2); }
.box { border: 1px solid var(--rule); border-radius: var(--r-md); padding: 12px; margin-bottom: 12px; }
th.num { text-align: right; }
table.plain th { background: none; padding: 4px 8px 4px 0; text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 500; }
table.plain td { padding: 6px 8px 6px 0; }
table.plain tbody tr { cursor: default; }
.exrow { display: grid; grid-template-columns: 96px 1fr auto; gap: 12px; align-items: start; padding: 8px 0; border-top: 1px solid var(--rule); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: start; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
fieldset { border: 0; padding: 0; margin: 14px 0 0; }
legend { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
.checks.col { flex-direction: column; font-size: 13px; }
.checks input, .opt input { height: auto; }
.hw { display: grid; grid-template-columns: 160px 1fr 1fr; gap: 12px; align-items: end; margin-bottom: 8px; }
.hw > span:first-child { font-weight: 500; padding-bottom: 8px; }
.modal.tall { max-height: 84vh; overflow-y: auto; }
/* Kiosk settings, as built: three groups; denominations as on the kiosk; simulators marked. */
.kgroups { display: grid; gap: 24px 40px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1.1fr); margin-top: 12px; }
@media (max-width: 1100px) { .kgroups { grid-template-columns: 1fr 1fr; } .kgroups > :last-child { grid-column: 1 / -1; } }
@media (max-width: 700px) { .kgroups { grid-template-columns: 1fr; } }
.kgroups h4 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.kgroups dl { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 12px; margin: 0; }
.kgroups dt { font-size: 13px; color: var(--ink-3); }
.kgroups dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.denoms { display: flex; flex-wrap: wrap; gap: 4px; }
.denom { font: 500 12px var(--mono); padding: 2px 8px; border-radius: 4px; background: var(--meter-soft); color: var(--meter); }
.denom.coin { border-radius: 999px; }
.denom.off { background: transparent; color: var(--ink-4); text-decoration: line-through; font-weight: 400; }

/* Fee arithmetic, same rules as @tppa/shared (half-up to centavos). */
function feeFor(f, c) {
  if (f.basis === 'FLAT') return toCents(f.amount);
  const tier = f.tiers.find((t) => c >= toCents(t.from) && (t.to === null || c < toCents(t.to))) || f.tiers[f.tiers.length - 1];
  return tier ? toCents(tier.fee) : 0;
}
function charges(collection, f) {
  const c = toCents(collection), fee = feeFor(f, c), r = parseFloat(f.rate) || 0;
  let charged = fee, vatable = 0, vat = 0, exempt = 0, zero = 0;
  if (f.treatment === 'VAT_INCLUSIVE') { vatable = Math.round(fee / (1 + r)); vat = fee - vatable; }
  if (f.treatment === 'VAT_EXCLUSIVE') { vatable = fee; vat = Math.round(fee * r); charged = fee + vat; }
  if (f.treatment === 'VAT_EXEMPT') exempt = fee;
  if (f.treatment === 'ZERO_RATED') zero = fee;
  return { c, charged, vatable, vat, exempt, zero, total: c + charged };
}
/* The receipt's money lines, as ChargesView in the console. */
function chargesHtml(x, treatment) {
  const row = (l, v, cls) => '<div class="' + (cls || '') + '"><span>' + l + '</span><span>&#8369;' + money(v) + '</span></div>';
  const uses = treatment === 'VAT_INCLUSIVE' || treatment === 'VAT_EXCLUSIVE';
  return '<div class="charges">' + row('Bill amount (for the utility)', x.c) + row('Service fee', x.charged) +
    (uses ? row('of which VATable sales', x.vatable, 'sub') + row('of which VAT', x.vat, 'sub') :
      treatment === 'VAT_EXEMPT' ? row('of which VAT-exempt sales', x.exempt, 'sub') : row('of which zero-rated sales', x.zero, 'sub')) +
    row('Customer pays', x.total, 't') + '</div>';
}

function attention() {
  const blocking = [], soon = [], waiting = [], scheduled = [];
  const where = (t) => branchName(t.branch) + ' ' + t.branch;
  for (const b of state.billers.filter((x) => x.active)) {
    const list = state.fees[b.code];
    if (!list.some((f) => f.inForce)) blocking.push(['bad', 'No fee', b.code + ' has no fee in force: tellers cannot take payments for it', 'fees']);
    for (const f of list) if (f.status === 'DRAFT') waiting.push(['off', 'Draft', b.code + ' fee version ' + f.v + ' is waiting for approval (drafted by ' + f.by + ')', 'fees']);
    for (const f of list) if (f.next) scheduled.push(['wait', 'Scheduled', b.code + ' fee version ' + f.v + ' takes effect ' + f.when, 'fees']);
  }
  for (const v of RECEIPTS) if (v.status === 'DRAFT') waiting.push(['off', 'Draft', 'Receipt layout version ' + v.v + ' is waiting for approval', 'receipt']);
  for (const t of state.terminals) {
    const s = t.series;
    if (t.status === 'ACTIVE' && !s) blocking.push(['bad', 'No OR series', 'Terminal ' + t.code + ' (' + where(t) + ') has no OR series: it cannot issue receipts', 'terminal/' + t.code]);
    else if (t.status === 'ACTIVE' && lowSeries(s)) soon.push(['wait', 'Running low', 'Terminal ' + t.code + ' (' + where(t) + ') has ' + fmtInt(s.end - s.next + 1) + ' OR numbers left', 'terminal/' + t.code]);

  }
  for (const t of kiosks()) {

/* Reset registration: same computer, OS reinstalled. Same terminal, code, permit and OR series; new key. */
function resetRegistration(code) {
  const t = term(code), s = t.series;
  const risks = [t.sync.seen < 60 ? 'RECENTLY_SEEN' : '', t.pending > 0 ? 'UNSENT' : '', t.dayOpen ? 'DAY_OPEN' : '', t.kind === 'KIOSK' ? 'KIOSK' : ''].filter(Boolean);
  const text = {
    RECENTLY_SEEN: 'This terminal was in use ' + ago(t.sync.seen) + '. If it still works, it does not need a reset.',
    UNSENT: t.pending + ' records on that computer were not sent yet. If it still runs, let it sync first: after a reset they cannot be sent, and their OR numbers may be printed again by the new setup.',
    DAY_OPEN: 'The business day of ' + t.dayOpen + ' is still open on it. Check it under Day end afterwards.',
    KIOSK: 'Collect the cash box first (staff mode, Collect cash), so its slip and count are recorded.',
  };
  const severe = risks.includes('UNSENT') || risks.includes('RECENTLY_SEEN');
  overlay('<h2>Reset registration of terminal ' + code + '?</h2><p class="muted">For the same computer after Windows was reinstalled: it keeps its code, BIR permit and OR series. A different computer is a new terminal (revoke this one). ' +
    'The current key stops working at once; a ' + appOf(t) + ' app still running there signs everyone out and goes back to setup, keeping what it has not sent in a separate file.</p>' +
    '<dl style="margin-top:12px;grid-template-columns:150px 1fr;font-size:13px"><dt>Last seen</dt><dd>' + ago(t.sync.seen) + '</dd><dt>Not yet sent then</dt><dd>' + (t.pending === null ? 'Not reported' : t.pending > 0 ? '<b>' + t.pending + ' records</b>' : 'Nothing') + '</dd>' +
    '<dt>Business day</dt><dd>' + (t.dayOpen ? '<b>' + t.dayOpen + ' still open</b>' : 'Closed') + '</dd><dt>OR numbers</dt><dd>' + (s ? 'Continue at <span class="mono">' + preview(s.pattern, s.next, t) + '</span>' : 'No active series') + '</dd></dl>' +
    (risks.length ? '<div class="callout ' + (severe ? 'bad' : 'warn') + '" style="margin-top:12px">' + risks.map((r) => text[r]).join('<br>') + '</div>' : '') +
    '<div style="margin-top:14px">' + field('Reason', '<input id="rr" placeholder="e.g. Windows reinstalled after a disk error">') + '</div>' +
    (risks.length ? '<div style="margin-top:12px">' + field('Type the terminal code ' + code + ' to confirm', '<input id="rc" class="code" maxlength="2" autocomplete="off">') + '</div>' : '') +
    '<p id="re" class="small" style="color:var(--stamp);min-height:1em;margin-top:8px"></p>' +
    '<div class="actions"><button class="btn ghost" onclick="closeOverlay()">Cancel</button><button class="btn danger solid" onclick="doReset(\'' + code + '\',' + (risks.length > 0) + ')">Reset and get a new code</button></div>', false, 'min(600px, 92vw)');
}
function doReset(code, needsCode) {
  const t = term(code), reason = $('#rr').value.trim();
  if (reason.length < 3) { $('#re').textContent = 'Enter a reason (at least 3 characters).'; return; }
  if (needsCode && $('#rc').value.trim() !== code) { $('#re').textContent = 'Type ' + code + ' to confirm.'; return; }
  withStepUp(() => {
    Object.assign(t.keys[0], { to: 'Nov 8, 2026, 2:42 PM', why: 'Registration reset: ' + reason, by: state.user.name }); // the new key is listed once the computer registers
    Object.assign(t, { status: 'PENDING', codeExpires: 'Nov 9, 2026, 2:42 PM', reset: { at: 'Nov 8, 2026, 2:42 PM', by: state.user.name, reason, unsent: t.pending, dayOpen: t.dayOpen } });
    toast('Registration reset: the old key no longer works.');
    regCode(code, t.kind, 'M4TW-8HQZ-2KDN');
  });
}

      '<div class="kgrid">' + [...list].sort((a, b) => rank(a) - rank(b)).map(kioskCardHtml).join('') + '</div>'
    : '<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px"><p class="small muted" style="margin:0">Newest first. Each box is counted at the office, once.</p><button class="btn sm" onclick="slipDialog()">Record from a slip</button></div>' + collectionsTable(COLLECTIONS, true);
  return head('Kiosks', 'Each kiosk now: in service or why not, the cash in its box, and the collections waiting to be counted at the office.') + kioskTabs() + body;
}
const diffOf = (c) => toCents(c.counted) - toCents(c.expected);
function collectionsTable(rows, withKiosk) {
  return '<div class="sheet kscroll"><table><thead><tr><th>Collected</th>' + (withKiosk ? '<th>Kiosk</th>' : '') + '<th>By</th><th class="num">Expected</th><th class="num">Counted</th><th class="num">Difference</th><th></th></tr></thead><tbody>' +
    rows.map((c) => {
      const t = term(c.kiosk), d = c.counted === null ? null : diffOf(c);
      return '<tr><td class="mono small" style="white-space:nowrap">' + c.at + (c.fromSlip ? '<span class="tag" title="Recorded by hand from the slip: the kiosk could not send it">From slip</span>' : '') + '</td>' + (withKiosk ? '<td><a href="#/kiosk/' + c.kiosk + '"><span class="mono">' + c.kiosk + '</span> ' + esc(t.name) + '</a></td>' : '') +
        '<td>' + esc(c.by) + '</td><td class="num mono">' + peso(c.expected) + '</td>' +
        '<td class="num mono">' + (c.counted === null ? '<span class="muted">-</span>' : peso(c.counted) + '<div class="small muted" style="font-family:inherit">' + esc(c.countedBy) + ', ' + c.countedAt + '</div>') + '</td>' +
        '<td class="num">' + (d === null ? chip('wait', 'Not counted') : d === 0 ? chip('ok', 'Matches') : chip('bad', (d < 0 ? 'Short ' : 'Over ') + '&#8369;' + money(Math.abs(d)))) +
        (c.note ? '<div class="small muted" style="text-align:right;max-width:260px;margin-left:auto">' + esc(c.note) + '</div>' : '') + '</td>' +
        '<td class="act">' + (c.counted === null ? '<button class="btn sm primary" onclick="countDialog(\'' + c.id + '\')">Enter the count</button>' : '') + '</td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<p class="small muted" style="margin-top:8px">The expected amount is what the kiosk&#39;s acceptors kept since the last collection (checked against head office&#39;s own journal). The count is entered once, by someone other than the collector; a difference is a critical exception and is emailed.</p>';
}
function kioskPage(code) {
  const t = term(code), k = KIOSK_LIVE[code];
  if (!t || !k) return kiosksPage();
  const pieces = k.pieces.map(([kind, v, n]) => '<tr><td>' + peso(v) + ' ' + (kind === 'NOTE' ? 'note' : 'coin') + '</td><td class="num mono">&times; ' + n + '</td><td class="num mono">' + peso((toCents(v) * n / 100).toFixed(2)) + '</td></tr>').join('');
  return '<p class="small"><a href="#/kiosks">Kiosks</a> /</p>' +
    head('Kiosk <span class="mono">' + code + '</span> &middot; ' + esc(t.name), esc(branchName(t.branch)) + ' (' + t.branch + ') &middot; <a href="#/terminal/' + code + '">Terminal settings</a>', '<div class="row">' + kioskChip(t) + holdButton(t) + '</div>') +
    (k.held ? '<div class="callout warn" style="margin-bottom:16px"><b>Out of service by head office</b> since ' + k.held.at + ', by ' + esc(k.held.by) + ': ' + esc(k.held.reason) + '. The kiosk shows customers the nearest counter. A custodian cannot bring it back in staff mode; only the console can.</div>' : '') +
    (k.state === 'OUT_OF_SERVICE' ? '<div class="callout bad" style="margin-bottom:16px"><b>Out of service</b> since ' + k.since + ': ' + k.reasons.map(([, m]) => esc(m)).join('; ') + '. It comes back by itself once fixed (staff mode at the kiosk).</div>' : '') +
    '<div class="grid2"><div class="sheet pad">' + gauge(t) + '<h3 style="margin-top:18px">In the box now</h3>' +
    (pieces ? '<table class="plain"><tbody>' + pieces + '<tr><td><b>Expected</b></td><td></td><td class="num mono"><b>' + peso(k.box.total) + '</b></td></tr></tbody></table>' : '<p class="muted">Empty: collected or nothing kept since.</p>') +
    '<p class="small muted" style="margin-top:8px">From the kiosk&#39;s journal since its last collection.</p></div>' +
    '<div class="sheet pad"><h3>Recent activity</h3><ol class="tl">' + (KIOSK_ACTIVITY[code] || []).map(([at, what, who]) => '<li><span class="mono small muted">' + at + '</span><b>' + what + '</b><span class="small muted">' + who + '</span></li>').join('') + '</ol>' +
    '<p class="small muted" style="margin-top:8px">State changes, doors, staff tasks and day ends, as the kiosk recorded them.</p></div></div>' +
    '<h3 style="margin-top:24px">Cash collections</h3>' + collectionsTable(COLLECTIONS.filter((c) => c.kiosk === code), false);
}
function holdDialog(code) {
  const t = term(code);
  overlay('<h2>Take kiosk ' + code + ' out of service</h2><p class="muted">' + esc(t.name) + ', ' + esc(branchName(t.branch)) + '. It stops taking new payments at its next sync (within a minute while online); a customer already paying finishes first. Customers see the nearest counter.</p>' +
    '<div style="margin-top:14px">' + field('Why', '<input id="hreason" placeholder="e.g. Mall closed for repairs until Nov 10">', 'Kept with the kiosk and in the audit log. Shown in staff mode, never to customers.') + '</div>' +
    '<div class="actions"><button class="btn ghost" onclick="closeOverlay()">Cancel</button><button class="btn danger solid" onclick="doHold(\'' + code + '\')">Take out of service</button></div>');
}
function doHold(code) {
  const reason = $('#hreason').value.trim();
  if (reason.length < 5) return toast('Write at least 5 characters.');
  withStepUp(() => {
    Object.assign(KIOSK_LIVE[code], { state: 'HELD', since: 'Nov 8, 2026, 2:50 PM', held: { by: state.user.name, at: 'Nov 8, 2026, 2:50 PM', reason }, reasons: [['HELD', 'Head office took this kiosk out of service']] });
    closeOverlay(); render(); toast('Kiosk ' + code + ' goes out of service at its next sync.');
  });
}
function releaseDialog(code) {
  const k = KIOSK_LIVE[code];
  overlay('<h2>Bring kiosk ' + code + ' back into service</h2><p class="muted">Taken out by ' + esc(k.held.by) + ' on ' + k.held.at + ': ' + esc(k.held.reason) + '.</p>' +
    '<p style="margin-top:10px">It takes payments again at its next sync, unless something else stops it (paper, a device, a full cash box).</p>' +
    '<div class="actions"><button class="btn ghost" onclick="closeOverlay()">Cancel</button><button class="btn primary" onclick="doRelease(\'' + code + '\')">Bring back into service</button></div>');
}
function doRelease(code) {
  withStepUp(() => { Object.assign(KIOSK_LIVE[code], { state: 'IN_SERVICE', since: 'Nov 8, 2026, 2:50 PM', held: null, reasons: [] }); closeOverlay(); render(); toast('Kiosk ' + code + ' is back in service at its next sync.'); });
}
/* A box swapped while the kiosk was reset or not recognised: it could not send the collection, so
 * its slip says NOT SENT and the office records it here from the slip, then counts it as usual. */
function slipDialog() {
  const ks = kiosks(), custodians = state.users.filter((u) => ['KIOSK_CUSTODIAN', 'BRANCH_MANAGER'].includes(u.role) && u.status === 'ACTIVE');
  overlay('<h2>Record a collection from its slip</h2><p class="muted">Only for a slip marked <b>NOT SENT</b>: the kiosk was reset or not recognised when the box was swapped, so it could not tell head office. Copy the slip as printed.</p>' +
    '<div class="grid2" style="margin-top:14px">' + field('Kiosk', '<select id="sk">' + ks.map((t) => '<option value="' + t.code + '">' + t.code + ' ' + esc(t.name) + '</option>').join('') + '</select>') +
    field('Collected by', '<select id="sb">' + custodians.map((u) => '<option>' + esc(u.name) + '</option>').join('') + '</select>') +
    field('Collected on', '<input id="sat" type="datetime-local" value="2026-11-08T07:30">') + field('Expected (on the slip)', '<input id="sexp" inputmode="decimal" placeholder="0.00">') + '</div>' +
    '<p class="small muted" style="margin-top:10px">Recorded with your name in the audit log, marked as from a slip. Then count the box as usual; someone other than the collector counts it.</p>' +
    '<div class="actions"><button class="btn ghost" onclick="closeOverlay()">Cancel</button><button class="btn primary" onclick="saveSlip()">Record the collection</button></div>', false, 'min(620px, 94vw)');
}
function saveSlip() {
  const exp = toCents($('#sexp').value);
  if (exp <= 0) return toast('Enter the expected amount printed on the slip.');
  const k = $('#sk').value, by = $('#sb').value;
  withStepUp(() => {
    COLLECTIONS.unshift({ id: 'c' + Date.now(), kiosk: k, at: 'Nov 8, 2026, 7:30 AM', by, expected: (exp / 100).toFixed(2), counted: null, fromSlip: true, pieces: [['NOTE', '1000.00', Math.floor(exp / 100000)], ['COIN', '1.00', Math.round((exp % 100000) / 100)]] });
    closeOverlay(); render(); toast('Collection recorded from the slip. Count the box next.');
  });
}
/* The office count, by denomination as the slip lists it; the total and difference follow. */
function countDialog(id) {
  const c = COLLECTIONS.find((x) => x.id === id), t = term(c.kiosk);
  overlay('<h2>Count the box of kiosk ' + c.kiosk + '</h2><p class="muted">' + esc(t.name) + ' &middot; collected ' + c.at + ' by ' + esc(c.by) + '. Count what is in the box, not what the slip says.</p>' +
    '<div class="kbody" style="margin-top:14px"><table class="plain count"><thead><tr><th>Piece</th><th class="num">Kiosk kept</th><th class="num">Counted</th><th class="num">Amount</th></tr></thead><tbody>' +
    c.pieces.map(([kind, v, n], i) => '<tr><td>' + peso(v) + ' ' + (kind === 'NOTE' ? 'note' : 'coin') + '</td><td class="num mono">' + n + '</td><td class="num"><input class="cnt" inputmode="numeric" data-v="' + toCents(v) + '" data-n="' + n + '" id="cn' + i + '" aria-label="Counted ' + money(toCents(v)) + ' ' + (kind === 'NOTE' ? 'notes' : 'coins') + '" oninput="countChanged()"></td><td class="num mono" id="ca' + i + '">-</td></tr>').join('') +
    '</tbody></table><div class="ctotal"><div><span class="l">Expected</span><span class="mono">' + peso(c.expected) + '</span></div><div><span class="l">Counted</span><span class="mono" id="ctot">&#8369;0.00</span></div><div><span class="l">Difference</span><span id="cdiff">' + chip('off', 'Enter the count') + '</span></div></div>' +
    '<div id="cnotewrap" hidden>' + field('What was found', '<input id="cnote" placeholder="e.g. Counted twice with the branch manager; one 100 note short">', 'Required when the count differs. The difference becomes a critical exception and is emailed.') + '</div></div>' +
    '<p class="small muted" style="margin-top:10px">Entered once and kept: it cannot be changed later. You cannot count a box you collected.</p>' +
    '<div class="actions"><button class="btn ghost" onclick="closeOverlay()">Cancel</button><button class="btn primary" id="csave" disabled onclick="saveCount(\'' + id + '\')">Save the count</button></div>', false, 'min(620px, 94vw)');
  document.querySelector('.modal').classList.add('kiosk');
}
window.countChanged = () => {
  let total = 0, all = true;
  document.querySelectorAll('.cnt').forEach((el, i) => {
    const raw = el.value.trim(), n = /^\d+$/.test(raw) ? +raw : null;
    if (n === null) all = false;
    const amt = n === null ? null : n * +el.dataset.v; if (amt !== null) total += amt;
    $('#ca' + i).textContent = amt === null ? '-' : money(amt);
    el.classList.toggle('off', n !== null && n !== +el.dataset.n);
  });
  const c = COLLECTIONS.find((x) => !x.counted), d = total - toCents(c.expected);
  $('#ctot').innerHTML = '&#8369;' + money(total);
  $('#cdiff').innerHTML = !all ? chip('off', 'Enter every line') : d === 0 ? chip('ok', 'Matches') : chip('bad', (d < 0 ? 'Short ' : 'Over ') + '&#8369;' + money(Math.abs(d)));
  $('#cnotewrap').hidden = !all || d === 0;
  $('#csave').disabled = !all;
};
function saveCount(id) {
  const c = COLLECTIONS.find((x) => x.id === id);
  let total = 0; document.querySelectorAll('.cnt').forEach((el) => (total += +el.value * +el.dataset.v));
  const d = total - toCents(c.expected), note = ($('#cnote') || {}).value || '';
  if (d !== 0 && note.trim().length < 5) return toast('Say what was found (at least 5 characters).');
  withStepUp(() => {
    Object.assign(c, { counted: (total / 100).toFixed(2), countedBy: state.user.name, countedAt: 'Nov 8, 2026, 2:50 PM', note: d ? note.trim() : undefined });
    if (d) EXCEPTIONS.unshift({ id: 'x' + Date.now(), sev: 'CRITICAL', kind: 'KIOSK_COUNT_DIFFERENCE', where: '0001 &middot; ' + c.kiosk, seq: '-', at: 'Nov 8, 2026, 2:50 PM', msg: 'The box of kiosk ' + c.kiosk + ' collected ' + c.at + ' was counted ' + (d < 0 ? 'short' : 'over') + ' by ' + money(Math.abs(d)) + ' (expected ' + money(toCents(c.expected)) + ', counted ' + money(total) + '): ' + note.trim() });
    closeOverlay(); render(); toast(d ? 'Count saved. The difference is a critical exception and was emailed.' : 'Count saved: it matches.');
  });
}

/* ------------------------------------------------------------------ system: alert emails */
const hourLabel = (h) => ((h + 11) % 12) + 1 + ':00 ' + (h < 12 ? 'AM' : 'PM');
function alerts() {
  const a = state.alerts, everyone = [...new Set([...a.alwaysTo.map((p) => p.email), ...a.recipients])];
  return head('Alert emails', 'Who is told by email when something needs attention: critical problems at once, and a report of each business day.') +
    '<div style="max-width:760px"><div class="sheet pad" style="margin-bottom:16px"><h3>Mail server</h3><p>' + chip('ok', 'Set') + ' <span class="mono">mail.tppainc.com:465</span> <span class="muted">sending as TPPA Payments &lt;payments@tppainc.com&gt;</span></p>' +
    '<p class="small muted" style="margin-top:8px">Last email sent Nov 8, 2026, 10:23 AM. Last daily report: 2026-11-07.</p>' +
    '<div style="margin-top:12px"><button class="btn" onclick="toast(\'Test email sent to ' + everyone.join(', ') + '.\')">Send a test email</button></div></div>' +
    '<div class="sheet pad"><h3>Recipients</h3>' + a.alwaysTo.map((p) => '<div class="rcpt always"><span><span class="mono">' + p.email + '</span> <span class="small muted">' + esc(p.name) + '</span></span>' + chip('blue', 'Super admin, always') + '</div>').join('') +
    a.recipients.map((r, i) => '<div class="rcpt"><span class="mono">' + r + '</span><button class="btn sm ghost" aria-label="Remove ' + r + '" onclick="state.alerts.recipients.splice(' + i + ',1);alertsChanged()">Remove</button></div>').join('') +
    '<div class="row" style="margin-top:8px"><div style="flex:1">' + field('Add an email address', '<input type="email" id="aadd" placeholder="accounting@tppainc.com">') + '</div><button class="btn" onclick="addRecipient()">Add</button></div>' +
    '<p class="small muted" style="margin-top:6px">Super admins with an email address (Users) always receive the alerts and cannot be removed here.</p>' +
    '<h3 style="margin-top:20px">What is sent</h3><label class="opt"><input type="checkbox"' + (a.critical ? ' checked' : '') + ' onchange="state.alerts.critical=this.checked;alertsChanged()"><span><b>Critical problems</b>, within minutes: a fee that does not match, an OR number used twice, a Z-reading that does not add up, a void approved by the wrong person, a kiosk&#39;s cash door opened without staff, a kiosk box counted over or short...</span></label>' +
    '<label class="opt"><input type="checkbox"' + (a.kiosk ? ' checked' : '') + ' onchange="state.alerts.kiosk=this.checked;alertsChanged()"><span><b>Kiosk notices</b>, within minutes: a kiosk out of service for 30 minutes, a cash box at 75 % of its limit, a kiosk not heard from for an hour. Sent once each, not repeated.</span></label>' +
    '<label class="opt"><input type="checkbox"' + (a.daily ? ' checked' : '') + ' onchange="state.alerts.daily=this.checked;alertsChanged()"><span><b>Daily report</b> of the previous business day: each branch&#39;s payments and day end, the problems and checks of the day.</span></label>' +
    '<div class="row" style="margin-left:24px;align-items:center"><label for="dh" class="muted">Sent from</label><select id="dh"' + (a.daily ? '' : ' disabled') + ' onchange="state.alerts.hour=+this.value;alertsChanged()">' + Array.from({ length: 24 }, (_, h) => '<option value="' + h + '"' + (h === a.hour ? ' selected' : '') + '>' + hourLabel(h) + '</option>').join('') + '</select><span class="small muted">Manila time</span></div>' +
    '<div style="margin-top:16px"><button class="btn primary" id="asave" disabled onclick="withStepUp(()=>{this.disabled=true;toast(\'Alert emails saved.\')})">Save</button></div></div></div>';
}
window.alertsChanged = () => { render(); $('#asave').disabled = false; };
window.addRecipient = () => {
  const e = $('#aadd').value.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) return toast('Enter a valid email address.');
  if (state.alerts.recipients.includes(e) || state.alerts.alwaysTo.some((p) => p.email === e)) return toast('Already on the list.');
  if (state.alerts.recipients.length >= 20) return toast('At most 20 recipients.');
  state.alerts.recipients.push(e); alertsChanged();
};

function about() {
  return head('About this mock-up', 'Approved for spec step 5d; brought up to the console as built on Nov 8, 2026.') + '<div class="sheet pad" style="max-width:720px">' +
    '<p>It shows the head-office console as the app has it: the menu of <span class="mono">apps/web/src/components/shell/nav.ts</span> (Overview; Setup; Rules; Daily work; Records; System) with the theme switch in the sidebar footer, and each screen with the app&#39;s own wording. When the two differ, the code is right and this file is out of date.</p>' +
    '<p style="margin-top:10px">Click through: sign-in with two-step login; the overview (today per branch, then what needs attention); branches (open Main Branch for Utilities at this branch, Digos to reactivate); users (the role chips); terminals (02 for a running-low series and a closed series, 05 for a kiosk with its settings and hardware profile, 01 to reset its registration); utilities; fees (switch the utility, open v2 for fee tiers); the receipt layout (the suggested two-copy form, New version for the editor); the daily report; collection files (pick Nov 7, then Generate again); exceptions; kiosks (K8: each kiosk now, Take out of service on 05, Cash collections then Enter the count or Record from a slip, open 06 or 07); the audit log (click a Details line); alert emails.</p>' +
    '<p style="margin-top:10px">Saving asks for your password once, then not again for 10 minutes (step-up, spec §8.1). Type anything. The test email does not ask.</p>' +
    '<p style="margin-top:10px">Nothing is saved (except the theme, kept in this browser as the console keeps it) and all names, numbers and codes are made up.</p></div>';
}

state.terminals.filter((t) => t.kind === 'KIOSK' && !t.kiosk).forEach((t) => (t.kiosk = JSON.parse(JSON.stringify(term('05').kiosk))));

/* ------------------------------------------------------------------ router */
function render() {
  const route = (location.hash.replace(/^#\//, '') || 'signin');
  const [name, arg] = route.split('/');
  const app = $('#app');
  if (name === 'signin' || (!state.signedIn && !['2fa', '2fa-setup', 'about'].includes(name))) { app.innerHTML = signIn(); return; }
  if (name === '2fa') { app.innerHTML = twoFactor(); return; }
  if (name === '2fa-setup') { app.innerHTML = twoFactorSetup(); return; }
  const screens = { overview, branches, users, terminals, utilities, billers: utilities, fees, receipt, daily, 'collection-files': collectionFiles, exceptions, audit, alerts, about, terminal: () => terminalDetail(arg), kiosks: kiosksPage, kiosk: () => kioskPage(arg) };
  const navKey = name === 'kiosk' ? 'kiosks' : name === 'terminal' ? 'terminals' : name === 'billers' ? 'utilities' : name;
  app.innerHTML = shell(navKey, (screens[name] || overview)());
  if (name === 'receipt') { rf(); thRefresh(); }
}
window.addEventListener('hashchange', () => { state.menuOpen = false; render(); window.scrollTo(0, 0); });
render();
</script>
</body>
